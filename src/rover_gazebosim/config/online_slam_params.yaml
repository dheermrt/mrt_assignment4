slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "root_link"
    scan_topic: "scan"
    mode: "online"  # "mapping" or "localization"
    
    # Sensor parameters
    resolution: 0.05  # Grid map resolution in meters
    map_update_interval: 2.0  # Time (sec) between updates
    max_laser_range: 10.0  # Maximum range of lidar in meters
    min_laser_range: 0.1  # Minimum usable lidar range
    
    # Optimization settings
    optimize_every_n_scans: 10
    loop_closure: true
    loop_closure_threshold: 0.11
    max_constraint_distance: 5.0
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.1
    
    # Odometry and transform settings
    odom_topic: "/odometry/filtered"
    odom_model_type: "diff"  # Differential drive (other options: "omni", "ackermann")
    provide_odom_tf: false
    transform_publish_period: 0.05
    
    # Map saving/loading
    map_file_name: "basic_map.sdf"
    save_map_timeout: 5.0
    use_scan_matching: true
    use_scan_barycenter: false
    
    # Debugging
    debug_logging: false
    publish_map_to_odom: true
