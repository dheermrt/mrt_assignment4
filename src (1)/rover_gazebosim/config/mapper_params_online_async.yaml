slam_toolbox:
  ros__parameters:
    mode: online_async
    map_file_name: ""
    resolution: 0.05  # Map resolution in meters/pixel
    max_laser_range: 30.0
    queue_size: 50
    minimum_time_interval: 0.0
    message_filer_timeout: 0.5

    # Laser scan topic and frame IDs
    scan_topic: "/scan"
    base_frame: "base_link"
    odom_frame: "odom"
    map_frame: "map"

    # Map update rates
    map_update_interval: 2.0
    map_publish_rate: 1.0

    # Pose graph optimization
    pose_graph_save_pose_ratio: 2.0
    optimization_frequency: 2.0
    global_sampling_distance: 0.5

    # Others
    use_scan_matching: true
    loop_closure: true
    resolution_adaptive: false
